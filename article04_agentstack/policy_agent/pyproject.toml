[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-agent"
version = "0.1.0"
description = "Agent Stack 版保单问答智能体（A2A 学习专栏篇四）"
requires-python = ">=3.13"
dependencies = [
    "agentstack-sdk==0.7.1",
    "mcp>=1.24,<2",
    "openai>=3.52.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
server = "agentstack_agents.policy_agent:run"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agentstack_agents*"]

[tool.setuptools.package-data]
agentstack_agents = ["data/*.md"]